apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: customer-service
  namespace: banking
  labels:
    release: banking-monitoring
spec:
  namespaceSelector:
    matchNames:
      - banking
  selector:
    matchLabels:
      app: customer-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
---

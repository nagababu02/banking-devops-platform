spring:
  application:
    name: loan-service
server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: loan-service
    version: 1.0.0-SNAPSHOT
